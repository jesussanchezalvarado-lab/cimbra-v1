<!--
  Esta página no depende de ningún servidor externo para abrirse ni para verse bien.
  La ilustración fija y los logos institucionales van incrustados en el propio archivo.
  La animación de la portada está en la carpeta portada (ilustracion.mp4 y, de respaldo, ilustracion.webm).

-->

<style>
  :root{
    --azul:#0055B7;--azul-osc:#003d85;--azul-claro:#e9f2fb;--celeste:#8FC6E8;
    --morado:#9F26B4;--morado-claro:#f3e8f7;
    --verde-texto:#2E7D1F;--verde-claro:#eafbe6;--verde-borde:#ACDA90;
    --rojo:#b0392b;
    --ambar-texto:#7a5d12;--ambar-claro:#fff8e6;--ambar-borde:#f0dca0;
    --tinta:#0d1b2a;--texto:#1a232b;--texto-2:#3a4551;--texto-3:#55606b;
    --borde:#e2e6ea;--gris-claro:#f4f6f8;--fondo-alt:#f9fafb;
    --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    --cond:'Roboto Condensed','Arial Narrow',system-ui,sans-serif;
    --curva:cubic-bezier(.215,.61,.355,1);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;padding:0;background:#fff;font-family:var(--sans);color:var(--texto);line-height:1.6;overflow-x:hidden}
  a{color:var(--azul)}
  a:hover{color:var(--azul-osc)}
  h1,h2,h3,h4{font-family:var(--cond);margin:0;line-height:1.15}
  img{display:block;max-width:100%;height:auto}
  button{font-family:inherit}
  .skip-link{position:absolute;left:-999px;top:0;background:#fff;color:var(--azul);padding:10px 18px;z-index:200;border-radius:0 0 6px 0}
  .skip-link:focus{left:0}
  :focus-visible{outline:3px solid #FFC845;outline-offset:3px}
  ::selection{background:var(--celeste)}
  .wrap{max-width:1140px;margin:0 auto;padding:0 clamp(16px,5vw,40px)}

  /* ===== logotipo: la "I" es la torre, dibujada en vector ===== */
  .wm{font-family:var(--sans);font-weight:400;letter-spacing:.16em;display:inline-flex;align-items:flex-end;line-height:.8;white-space:nowrap;margin:0}
  .wm .torre{display:inline-block;height:.74em;width:.34em;margin:0 .16em 0 .02em;flex:none}
  .wm .torre svg{display:block;width:100%;height:100%}

  /* ===== portada ===== */
  .portada{position:relative;overflow:hidden;color:#fff;padding-top:74px;min-height:max(620px,100svh);display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% 110%,#0A67D0 0,var(--azul) 55%,var(--azul-osc) 100%)}
  .portada-cuerpo{display:grid;justify-items:center;text-align:center;gap:18px;padding:clamp(24px,7vh,80px) 16px 0}
  .portada .wm{font-size:clamp(56px,10vw,136px)}
  .portada-linea{font-size:clamp(17px,2vw,21px);line-height:1.45;max-width:36ch;margin:0;color:#e9f2fb;text-wrap:balance}
  .portada-saludo{display:none;margin:0;font-size:15px;color:#e9f2fb}
  .btn-portada{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--azul);text-decoration:none;font:600 15px var(--sans);padding:12px 22px;border-radius:999px;border:0;cursor:pointer;box-shadow:0 4px 14px rgba(0,25,60,.25);transition:background .15s,transform .15s}
  .btn-portada:hover{background:var(--azul-claro);color:var(--azul);transform:translateY(1px)}
  .btn-portada svg{width:18px;height:18px}
  .portada .ilus-caja{position:relative;color:#fff;width:min(100%,1280px,calc(52svh * 2.37));margin:auto auto 0;padding-top:20px}
  .ilus-video{position:absolute;left:0;right:0;bottom:0;width:100%;aspect-ratio:1840/776;display:block;opacity:0;mix-blend-mode:screen;pointer-events:none;transition:opacity .4s}
  .ilus-caja.anima .ilus-video{opacity:1}
  .ilus-caja.anima .ilus{opacity:0}
  .ilus-pausa{position:absolute;right:max(10px,2%);bottom:10px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,40,90,.45);color:#fff;cursor:pointer;padding:0;opacity:.75;transition:opacity .15s,background .15s}
  .ilus-pausa:hover,.ilus-pausa:focus-visible{opacity:1;background:rgba(0,40,90,.75)}
  .ilus-pausa:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .ilus-pausa svg{width:16px;height:16px}
  .ilus-pausa[hidden]{display:none}
  @media (prefers-reduced-motion: no-preference){
    .portada:not(.compacta) .btn-portada svg{animation:bote 2.4s ease-in-out infinite}
    @keyframes bote{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
  }
  /* Al volver: la misma portada a media altura, con el avance a la vista */
  .portada.compacta{min-height:0}
  .portada.compacta .portada-cuerpo{padding-top:4px;gap:12px}
  .portada.compacta .wm{font-size:clamp(44px,6vw,76px)}
  .portada.compacta .portada-linea{display:none}
  .portada.compacta .portada-saludo{display:block}
  .portada.compacta .ilus-caja{width:min(100%,calc(24svh * 2.37));padding-top:14px}

  /* ===== menú de tarjetas ===== */
  .menu-wrap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:min(940px,calc(100% - 32px));z-index:25}
  .menu{position:relative;height:60px;background:#fff;color:var(--tinta);border-radius:14px;box-shadow:0 6px 24px rgba(0,30,70,.18);overflow:hidden;transition:height .45s var(--curva)}
  .menu-top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 10px;position:relative;z-index:2}
  .menu-btn{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;border:0;background:none;color:inherit;cursor:pointer;font:600 14px var(--sans);border-radius:10px}
  .menu-btn:hover{background:var(--azul-claro)}
  .hamb{position:relative;width:22px;height:12px}
  .hamb i{position:absolute;left:0;width:100%;height:2px;border-radius:2px;background:currentColor;transition:transform .3s ease,top .3s ease}
  .hamb i:first-child{top:0}.hamb i:last-child{top:10px}
  .menu.abierto .hamb i:first-child{top:5px;transform:rotate(45deg)}
  .menu.abierto .hamb i:last-child{top:5px;transform:rotate(-45deg)}
  .menu-centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;pointer-events:none}
  .menu-centro > *{grid-area:1/1;transition:opacity .3s ease,transform .3s ease;white-space:nowrap}
  /* Acrónimo ULagos a color sobre blanco, con la unidad en Open Sans Light mayúscula,
     en dos líneas que no superan el alto del acrónimo (Manual de Normas Gráficas, p. 17-18). */
  .menu-inst{display:flex;align-items:center;gap:10px}
  .menu-inst svg{display:block;height:26px;width:auto}
  .menu-inst .unidad{font-weight:300;text-transform:uppercase;font-size:10.5px;line-height:1.15;letter-spacing:.05em;color:var(--tinta);text-align:left}
  .menu-marca{display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(6px)}
  .menu-marca .wm{font-size:22px;color:var(--azul)}
  .mini{display:flex;gap:3px;width:120px}
  .mini i{flex:1;height:6px;border-radius:2px;background:#dfe5ea}
  .mini i.curso{background:var(--celeste)}.mini i.listo{background:var(--azul)}
  .menu-wrap.bajo .menu-inst{opacity:0;transform:translateY(-6px)}
  .menu-wrap.bajo .menu-marca{opacity:1;transform:none}
  .menu-cta{height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--azul);color:#fff;font:600 14px var(--sans);cursor:pointer}
  .menu-cta:hover{background:var(--azul-osc)}
  .menu-cont{position:absolute;left:0;right:0;top:60px;padding:8px;display:flex;gap:10px;align-items:stretch}
  .menu:not(.abierto) .menu-cont{visibility:hidden}
  .menu-card{flex:1 1 0;min-width:0;min-height:150px;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;color:#fff;
    opacity:0;transform:translateY(40px);transition:opacity .35s ease,transform .45s var(--curva)}
  .menu.abierto .menu-card{opacity:1;transform:none}
  .menu.abierto .menu-card:nth-child(2){transition-delay:.06s}
  .menu.abierto .menu-card:nth-child(3){transition-delay:.12s}
  .menu-card h2{font-weight:600;font-size:21px;color:inherit}
  .menu-card ul{list-style:none;margin:auto 0 0;padding:0;display:grid;gap:4px}
  .menu-card a,.menu-card .pronto{display:inline-flex;align-items:center;gap:6px;font-size:15px;text-decoration:none;color:#fff}
  .menu-card a:hover{color:#fff;text-decoration:underline;text-underline-offset:3px}
  .menu-card a svg{width:14px;height:14px;flex:none}
  .menu-card .pronto{opacity:.72}
  .menu-card .pronto small{font-size:11px;letter-spacing:.04em;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:0 5px}
  .menu-card:nth-child(1){background:#002E66}.menu-card:nth-child(2){background:#003F8A}.menu-card:nth-child(3){background:#0055B7}
  @media (max-width:700px){
    .menu-cta,.mini,.menu-btn-txt{display:none}
    .menu-inst svg{height:22px}
    .menu-inst .unidad{font-size:9px}
    .menu-cont{flex-direction:column}
    .menu-card{min-height:0;flex:none}
  }

  /* ===== logotipo: la C son nueve dovelas, las mismas nueve etapas del arco ===== */
  .wm .letra-c{display:block;height:.74em;width:auto;margin-right:.14em;flex:none}

  .portada[hidden]{display:none}
  /* ===== el arco del avance ===== */
  .avance-arco{background:linear-gradient(180deg,#003d85 0%,#0055B7 100%);color:#fff;scroll-margin-top:0}
  .avance-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px 40px;align-items:center;padding-block:44px 30px}
  body.de-vuelta .avance-grid{padding-top:112px}
  @media (max-width:760px){.avance-grid{grid-template-columns:1fr;padding-top:36px}}
  .av-eyebrow{font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#cfe4fb;margin:0 0 6px}
  .av-titulo{font-size:clamp(30px,3.6vw,42px);line-height:1.06;margin:0 0 12px;color:#fff;text-wrap:balance}
  .av-cuenta{margin:0 0 6px;font-size:16px;color:#fff}
  .av-tema{margin:0 0 18px;font-size:14.5px;color:#e9f2fb;max-width:52ch}
  .av-tema b{font-weight:600;color:#cfe4fb}
  .av-nota{margin:16px 0 0;font-size:12.5px;line-height:1.5;color:#cfe4fb;max-width:52ch}
  .arco-box svg{display:block;width:100%;height:auto;overflow:visible}
  .arco-box .piedra{transition:opacity .5s ease}
  .arco-box .cimbra{transition:opacity .8s ease,transform .9s cubic-bezier(.215,.61,.355,1)}
  .arco-box .cimbra.fuera{opacity:0;transform:translateY(22px)}
  @media (prefers-reduced-motion: no-preference){
    .arco-box .en-curso{animation:latido 1.8s ease-in-out infinite}
    @keyframes latido{0%,100%{opacity:1}50%{opacity:.5}}
    .arco-box .nueva{animation:colocar .8s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d,0s)}
    @keyframes colocar{from{opacity:0;transform:translate(var(--tx),var(--ty))}}
  }

  /* ===== banda de avance (anterior, ya no se usa) ===== */
  .banda-zona{padding-top:36px;scroll-margin-top:90px}
  .banda{background:#fff;border:1px solid #b9d9f0;border-radius:14px;box-shadow:0 6px 22px rgba(13,27,42,.08);display:grid;grid-template-columns:1.25fr 1fr auto;align-items:center}
  .banda > div{padding:18px 22px}
  .banda > div + div{border-left:1px solid var(--borde)}
  .banda-rot{font:700 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--azul);margin:0 0 5px}
  .banda-tema{margin:0;font-size:15px;line-height:1.5;color:var(--texto-2)}
  .banda-tema.vacio{color:var(--texto-3)}
  .segmentos{display:flex;gap:4px;margin:0 0 7px}
  .seg{height:10px;flex:1;border-radius:3px;background:var(--gris-claro);border:1px solid #dfe5ea}
  .seg.curso{background:var(--celeste);border-color:#7cb8dd}
  .seg.listo{background:var(--azul);border-color:var(--azul)}
  .seg.muda{background:repeating-linear-gradient(45deg,#f4f6f8,#f4f6f8 3px,#e8ecf0 3px,#e8ecf0 6px)}
  .banda-cuenta{margin:0;font-size:13px;color:var(--texto-3)}
  .banda-boton{text-align:right}
  .aviso-guardado{margin:10px 2px 0;font-size:12.5px;color:var(--texto-3)}
  @media (max-width:860px){
    .banda{grid-template-columns:1fr}
    .banda > div + div{border-left:none;border-top:1px solid var(--borde)}
    .banda-boton{text-align:left}
  }

  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 20px;border-radius:9px;font:700 14px var(--sans);cursor:pointer;border:none;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,27,42,.14)}
  .btn-pri{background:var(--azul);color:#fff}
  .btn-pri:hover{background:var(--azul-osc);color:#fff}

  /* ===== momentos y tarjetas ===== */
  .momentos{padding:44px 0 8px}
  .momento{margin-bottom:38px}
  .momento.fase-1{--fase:#0055B7;--fase-suave:#e9f2fb}
  .momento.fase-2{--fase:#9F26B4;--fase-suave:#f3e8f7}
  .momento.fase-3{--fase:#2E7D1F;--fase-suave:#eafbe6}
  .momento-cab{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:0 0 4px}
  .momento-n{font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--fase)}
  .momento h2{font-size:clamp(21px,2.6vw,26px);color:var(--tinta)}
  .momento-linea{height:3px;background:linear-gradient(90deg,var(--fase),var(--fase-suave));border-radius:2px;margin:10px 0 18px}
  .tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}
  .tarjeta{display:flex;flex-direction:column;background:#fff;border:1px solid var(--borde);border-radius:12px;padding:18px 20px 16px;text-decoration:none;color:inherit;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .tarjeta:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(13,27,42,.1);border-color:var(--fase,var(--azul));color:inherit}
  .tarjeta.curso{border:1.5px solid var(--azul);background:#fbfdff}
  .tarjeta-num{font:700 11px var(--sans);letter-spacing:.07em;color:var(--texto-3);margin:0 0 6px}
  .momento .tarjeta-num{color:var(--fase)}
  .tarjeta h3{font-size:18px;color:var(--tinta);margin:0 0 6px}
  .tarjeta p.d{font-size:14px;line-height:1.55;color:var(--texto-3);margin:0 0 14px;flex:1}
  .tarjeta-pie{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .chip{font:700 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:20px}
  .chip-listo{background:var(--verde-claro);color:var(--verde-texto);border:1px solid var(--verde-borde)}
  .chip-curso{background:var(--azul-claro);color:var(--azul);border:1px solid #b9d9f0}
  .chip-nada{background:var(--gris-claro);color:var(--texto-3);border:1px solid var(--borde)}
  .ir{font:700 13.5px var(--sans);color:var(--azul)}
  .tarjeta:hover .ir{text-decoration:underline}

  /* ===== herramientas ===== */
  .herramientas{background:var(--fondo-alt);border-top:1px solid var(--borde);margin-top:26px;padding:36px 0 44px}
  .herr-cab h2{font-size:clamp(19px,2.2vw,23px);color:var(--tinta)}
  .herr-cab p{margin:6px 0 18px;font-size:15px;line-height:1.6;color:var(--texto-3);max-width:70ch}
  .herr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .tarjeta.herr{border-left:4px solid var(--morado)}
  .tarjeta.herr:hover{border-color:var(--borde);border-left-color:var(--morado);box-shadow:0 12px 26px rgba(13,27,42,.1)}
  .herr-estado{font-size:13.5px;color:var(--morado);font-weight:600}

  /* ===== qué es ===== */
  .que-es{padding-block:40px 8px;scroll-margin-top:90px}
  .que-es .rot{font:700 11.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--texto-3);margin:0 0 6px}
  .que-es p{margin:0;max-width:65ch;color:var(--texto-2)}

  /* ===== pie ===== */
  /* Isologotipo en blanco sobre el azul institucional, como indica el manual para fondos de color. */
  .pie{background:var(--azul);color:#e9f2fb;margin-top:40px;padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px))}

const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const $ = (sel) => document.querySelector(sel);

/* ===================== ESTADO ===================== */
const EJEMPLO = PARAMS.has('ejemplo');
let almacenamientoOk = true;

const claves = (c) => (Array.isArray(c) ? c : [c]).filter(Boolean);
function leer(clave){
  for (const k of claves(clave)) {
    let raw;
    try { raw = localStorage.getItem(k); } catch(e) { almacenamientoOk = false; return null; }
    if (raw) { try { return JSON.parse(raw); } catch(e) { /* dato dañado, se prueba la siguiente */ } }
  }
  return null;
}
/* Lo guardado, o el avance inventado si la página se abrió con ?ejemplo. */
function datos(clave){
  if (!EJEMPLO) return leer(clave);
  for (const k of claves(clave)) if (ESTADO_EJEMPLO[k]) return ESTADO_EJEMPLO[k];
  return null;
}
/* Un recurso está en progreso si guardó algo más que su versión y su fecha. */
const IGNORAR = ['version','actualizado','salida','cierre'];
function tieneContenido(obj){
  if (!obj || typeof obj !== 'object') return false;
  return Object.entries(obj).some(([k, v]) => {
    if (IGNORAR.indexOf(k) >= 0) return false;
    if (typeof v === 'string') return v.trim().length > 0;
    if (Array.isArray(v)) return v.some(x => x && typeof x === 'object'
      ? Object.values(x).some(y => typeof y === 'string' ? y.trim() : !!y)
      : !!x);
    if (v && typeof v === 'object') return Object.values(v).some(x => !!x);
    return false;
  });
}
/* Terminado, según el criterio de la asignatura. El recurso lo guarda en
   cierre = { descargado:true, respaldado:true } al marcar las dos casillas. */
/* Las dos casillas del cierre (comun/cierre.js) se guardan en una clave propia,
   cimbra_cierre_v1, con una entrada por etapa. */
const CLAVE_CIERRE = 'cimbra_cierre_v1';
const CIERRE_EJEMPLO = { idea:{ descargado:true, respaldado:true }, planteamiento:{ descargado:true, respaldado:true } };
function cierreDe(id){
  if (EJEMPLO) return CIERRE_EJEMPLO[id] || null;
  try { return (JSON.parse(localStorage.getItem(CLAVE_CIERRE) || '{}') || {})[id] || null; } catch(e) { return null; }
}
function estaTerminado(obj, id){
  const c = (id && cierreDe(id)) || (obj && obj.cierre);
  return !!(c && c.descargado && c.respaldado);
}

/* Avance inventado para ?ejemplo. Las claves deben ser las mismas de RECURSOS. */
const ESTADO_EJEMPLO = {
  'cimbra_ficha_v1': { fenomeno:'la motivación', sujetos:'estudiantes de 8° básico', contexto:'un liceo municipal de Osorno', cierre:{ descargado:true, respaldado:true } },
  'cimbra_planteamiento_v1': { p_principal:'¿De qué manera...?', cierre:{ descargado:true, respaldado:true } },
  'cimbra_marco_v1': { conceptos:[{ nombre:'motivación' }] },
  'cimbra_referencias_v1': { refs:[{ texto:'a', doi:true, autores:true },{ texto:'b', doi:true, autores:true },{ texto:'c' }] },
};
function estadoDe(clave, id){
  if (!claves(clave).length) return { conocido:false, curso:false, listo:false, datos:null };
  const obj = datos(clave);
  const listo = estaTerminado(obj, id);
  return { conocido:true, curso: tieneContenido(obj) && !listo, listo, datos: obj };
}

/* ===================== TEMA GUARDADO ===================== */
function temaGuardado(){
  const f = datos(CLAVE_IDEA);
  if (!f) return '';
  const fen = (f.fenomeno||'').trim(), suj = (f.sujetos||'').trim(), con = (f.contexto||'').trim();
  if (!fen && !suj && !con) return '';
  return `${fen || '[fenómeno]'} en ${suj || '[en quiénes]'}, en ${con || '[dónde]'}.`;
}

/* ===================== AVANCE (se calcula una vez) ===================== */
function calcularAvance(){
  const estados = RECURSOS.map(r => estadoDe(r.clave, r.id));
  const listos = estados.filter(e => e.listo).length;
  const enCurso = estados.filter(e => e.curso).length;
  /* Dónde retomar. El último en curso, o el primero sin empezar. */
  let destino = estados.map((e, i) => ({ e, i })).filter(x => x.e.curso).pop();
  if (!destino) destino = estados.map((e, i) => ({ e, i })).find(x => x.e.conocido && !x.e.listo && !x.e.curso);
  if (!destino) destino = { e: estados[0], i: 0 };
  return { estados, listos, enCurso, destino: destino.i, primeraVez: !listos && !enCurso };
}
const AV = calcularAvance();

/* La portada completa se ve hasta que la persona baja o usa su botón. Desde ahí,
   este navegador lo recuerda y al volver se abre directo en el arco del avance.
   Con ?portada en la dirección se ve siempre completa (útil para mostrarla en clase). */
const DE_VUELTA = (() => { try { return localStorage.getItem(CONFIG.clavePortada) === '1' && !PARAMS.has('portada'); } catch(e) { return false; } })();

/* ===================== EL ARCO DEL AVANCE =====================
   Nueve dovelas, una por etapa. Las etapas 1 a 4 suben por la izquierda, las 5 a 8
   por la derecha y la 9, Conclusiones, es la dovela central. Mientras falte alguna,
   la cimbra de madera sigue debajo; con las nueve, se retira. */
const ARCO = { W:400, H:250, CX:200, CY:222, R1:104, R2:150, SEG:20, GAP:.7 };
const POS_ARCO = [0,1,2,3,8,7,6,5,4];
const CLAVE_ARCO = 'cimbra_arco_visto_v1';
function svgArco(estados, animar){
  const {W,H,CX,CY,R1,R2,SEG,GAP} = ARCO, f = n => n.toFixed(1);
  const pt = (r,a) => [CX + r*Math.cos(a*Math.PI/180), CY - r*Math.sin(a*Math.PI/180)];
  const dovela = pos => { const a0=180-SEG*pos-GAP, a1=180-SEG*(pos+1)+GAP;
    const [x1,y1]=pt(R2,a0),[x2,y2]=pt(R2,a1),[x3,y3]=pt(R1,a1),[x4,y4]=pt(R1,a0);
    return `M${f(x1)} ${f(y1)}A${R2} ${R2} 0 0 1 ${f(x2)} ${f(y2)}L${f(x3)} ${f(y3)}A${R1} ${R1} 0 0 0 ${f(x4)} ${f(y4)}Z`; };
  /* cimbra: costilla doble, puntales, pies derechos y cruces */
  let puntales=''; for (let a=20;a<180;a+=20){ const [x,y]=pt(R1-2,a),[x2,y2]=pt(R1-26,a); puntales+=`M${f(x)} ${f(y)}L${f(x2)} ${f(y2)}`; }
  const ri=R1-26, alto=dx=>f(CY-Math.sqrt(Math.max(0,ri*ri-dx*dx)));
  const postes=[-70,-35,0,35,70].map(dx=>`M${CX+dx} ${CY}L${CX+dx} ${alto(dx)}`).join('');
  const cruces=`M${CX-70} ${CY-6}L${CX-35} ${+alto(35)+4}M${CX+70} ${CY-6}L${CX+35} ${+alto(35)+4}M${CX-35} ${CY-6}L${CX} ${CY-R1+30}M${CX+35} ${CY-6}L${CX} ${CY-R1+30}`;
  const completo = estados.every(e => e.listo);
  const cimbraFuera = completo && !(animar && animar.retirarCimbra);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(animar && animar.etiqueta || '')}">`;
  s += `<path d="M0 ${CY}H${W}" stroke="#fff" stroke-width="1.6" opacity=".9"/><path d="M0 ${CY+14}C60 ${CY+4} 110 ${CY+4} 160 ${CY+14}S300 ${CY+26} ${W} ${CY+12}" fill="none" stroke="#fff" stroke-width="1.2" opacity=".45"/>`;
  s += `<g fill="none" stroke="#fff" stroke-width="1.3" opacity=".6"><circle cx="342" cy="44" r="16"/><path d="M40 64c6-10 20-10 24-2 5-8 18-6 19 4h-47z"/></g>`;
  s += `<g class="cimbra${cimbraFuera ? ' fuera' : ''}" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".75"><path d="M${CX-R1+2} ${CY}A${R1-2} ${R1-2} 0 0 1 ${CX+R1-2} ${CY}M${CX-ri} ${CY}A${ri} ${ri} 0 0 1 ${CX+ri} ${CY}"/><path d="${puntales}" opacity=".8"/><path d="${postes}"/><path d="${cruces}" opacity=".7"/></g>`;
  estados.forEach((e, i) => {
    const pos = POS_ARCO[i], d = dovela(pos);
    const est = e.listo ? 'terminada' : e.curso ? 'en curso' : 'sin empezar';
    let pieza, extra = '';
    if (e.listo) {
      pieza = `<path d="${d}" fill="#fff" stroke="#fff" stroke-width="1.2"/>`;
      if (animar && animar.nuevas && animar.nuevas.indexOf(i) >= 0) {
        const a = 180 - SEG*(pos+.5), k = 34;
        extra = ` class="piedra nueva" style="--tx:${f(k*Math.cos(a*Math.PI/180))}px;--ty:${f(-k*Math.sin(a*Math.PI/180)-10)}px;--d:${(animar.nuevas.indexOf(i)*.25).toFixed(2)}s"`;
      }
    } else if (e.curso) {
      pieza = `<path class="en-curso" d="${d}" fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    } else {
      pieza = `<path d="${d}" fill="none" stroke="#fff" stroke-width="1" stroke-dasharray="1.5 4" opacity=".45"/>`;
    }
    s += `<g${extra || ' class="piedra"'}><title>${esc(RECURSOS[i].n)}: ${est}</title>${pieza}</g>`;
  });
  return s + '</svg>';
}

function pintarBanda(){
  const { estados, listos, enCurso, primeraVez } = AV;
  const total = RECURSOS.length, completo = listos === total;
  const tema = temaGuardado();

  let cuenta;
  if (listos) cuenta = `${listos} de ${total} etapas terminadas${enCurso ? `, ${enCurso} en curso` : ''}.`;
  else if (enCurso) cuenta = `${enCurso} ${enCurso === 1 ? 'etapa en curso' : 'etapas en curso'}, ninguna terminada todavía.`;
  else cuenta = 'Todavía no hay avance registrado en este navegador.';

  $('#avEyebrow').textContent = DE_VUELTA ? 'Hola de nuevo' : 'Tu avance';
  $('#avTitulo').textContent = completo ? `Terminaste las ${total === 9 ? 'nueve' : total} etapas`
    : primeraVez ? 'Así empieza tu investigación' : 'Así va tu investigación';
  $('#avCuenta').textContent = cuenta;
  $('#avTema').innerHTML = tema ? `<b>Tu tema.</b> ${esc(tema)}` : 'Tu tema se arma en el primer recurso y aparece aquí.';

  const rec = RECURSOS[AV.destino], btn = $('#avBoton');
  if (completo) { $('#avBotonTxt').textContent = 'Revisar mis etapas'; btn.href = '#momentosWrap'; }
  else { $('#avBotonTxt').textContent = (primeraVez ? 'Empezar con ' : 'Seguir con ') + rec.n; btn.href = url(rec.ruta); }

  /* Qué se ve colocarse: las piedras terminadas desde la última visita, y la cimbra
     retirándose la primera vez que se completa. En la vista de ejemplo no se anima. */
  const hechas = estados.map((e, i) => e.listo ? i : -1).filter(i => i >= 0);
  let previas = null;
  if (!EJEMPLO) { try { previas = JSON.parse(localStorage.getItem(CLAVE_ARCO) || 'null'); } catch(e) {} }
  const animar = { etiqueta: 'Avance de la investigación. ' + cuenta, nuevas: [], retirarCimbra: false };
  if (Array.isArray(previas)) {
    animar.nuevas = hechas.filter(i => previas.indexOf(i) < 0);
    animar.retirarCimbra = completo && previas.length < total;
  }
  $('#arco').innerHTML = svgArco(estados, animar);
  if (animar.retirarCimbra) setTimeout(() => { const c = $('#arco .cimbra'); if (c) c.classList.add('fuera'); }, 900 + animar.nuevas.length * 250);
  if (!EJEMPLO) { try { localStorage.setItem(CLAVE_ARCO, JSON.stringify(hechas)); } catch(e) {} }

  /* Firefox aísla cada archivo abierto desde el computador, así que la portada
     puede no ver lo que guardaron los recursos. En Chrome y Edge, o desde un servidor, no pasa. */
  const firefoxLocal = location.protocol === 'file:' && /firefox/i.test(navigator.userAgent);
  $('#avisoGuardado').textContent = !almacenamientoOk
    ? 'Este navegador no permite guardar el avance. Descarga el documento de cada recurso para no perder tu trabajo.'
    : firefoxLocal
      ? 'Estás abriendo Cimbra desde los archivos del computador en Firefox, que puede no mostrar aquí tu avance. Tu trabajo sigue guardado dentro de cada recurso. Para ver el avance en esta portada, ábrela en Chrome o Edge.'
      : 'Muestra el avance guardado en este navegador y en este computador. La copia real de cada etapa es el documento que descargas.';

  $('#mini').innerHTML = estados.map(e => `<i class="${e.listo ? 'listo' : (e.curso ? 'curso' : '')}"></i>`).join('');
}

/* ===================== TARJETAS ===================== */
function tarjetaRecurso(i){
  const r = RECURSOS[i], e = AV.estados[i];
  const chip = !e.conocido ? ''
    : e.listo ? '<span class="chip chip-listo">Terminado</span>'
    : e.curso ? '<span class="chip chip-curso">Lo estás trabajando</span>'
    : '<span class="chip chip-nada">Sin empezar</span>';
  const ir = e.curso ? 'Continuar →' : (e.listo ? 'Abrir de nuevo →' : 'Abrir →');
  return `<a class="tarjeta${e.curso ? ' curso' : ''}" href="${url(r.ruta)}">
      <p class="tarjeta-num">${i + 1}</p>
      <h3>${esc(r.n)}</h3>
      <p class="d">${esc(r.d)}</p>
      <div class="tarjeta-pie">${chip || '<span></span>'}<span class="ir">${ir}</span></div>
    </a>`;
}

function pintarMomentos(){
  $('#momentosWrap').innerHTML = MOMENTOS.map((m, mi) => `
    <section class="momento fase-${mi + 1}">
      <div class="momento-cab">
        <span class="momento-n">${esc(m.rot)}</span>

      <div class="momento-linea"></div>
      <div class="tarjetas">${m.recursos.map(tarjetaRecurso).join('')}</div>
    </section>`).join('');
}

function estadoReferencias(clave){
  const obj = datos(clave);
  const refs = (obj && Array.isArray(obj.refs) ? obj.refs : []).filter(r => (r.texto||'').trim());
  if (!refs.length) return 'Sin referencias guardadas';
  const ver = refs.filter(r => r.doi && r.autores).length;
  return `${refs.length} ${refs.length === 1 ? 'referencia' : 'referencias'}, ${ver} ${ver === 1 ? 'verificada' : 'verificadas'}`;
}

}

        ? `<li><a href="${esc(e.url)}"${/^https?:/.test(e.url) ? ' target="_blank" rel="noopener license"' : ''}>${flecha}${esc(e.n)}</a></li>`
        : `<li><span class="pronto" aria-disabled="true">${esc(e.n)} <small>pronto</small></span></li>`).join('')}</ul>
    </section>`).join('');

  const menu = $('#menu'), btn = $('#menuBtn'), cont = $('#menuCont');
  const abierto = () => menu.classList.contains('abierto');
  function abrir(si){
    menu.classList.toggle('abierto', si);
    btn.setAttribute('aria-expanded', si);
    btn.querySelector('.menu-btn-txt').textContent = si ? 'Cerrar' : 'Menú';
    menu.style.height = si ? (60 + cont.scrollHeight) + 'px' : '60px';
    if (si) { const f = cont.querySelector('a'); if (f) setTimeout(() => f.focus({ preventScroll:true }), 200); }
  }
  btn.addEventListener('click', () => abrir(!abierto()));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && abierto()) { abrir(false); btn.focus(); } });
  document.addEventListener('click', e => { if (abierto() && !menu.contains(e.target)) abrir(false); });
  cont.addEventListener('click', e => { if (e.target.closest('a[href^="#"]')) abrir(false); });
  window.addEventListener('resize', () => { if (abierto()) menu.style.height = (60 + cont.scrollHeight) + 'px'; });
  $('#menuAvance').addEventListener('click', () => irA('#bandaZona'));
}

function irA(sel){
  const el = $(sel); if (!el) return;
  el.scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block:'start' });
}

/* ===================== PORTADA ===================== */
/* Primera visita: portada completa, y su botón baja al arco.
   De vuelta: la portada no se muestra y la página abre directo en el arco. */
function pintarPortada(){
  const portada = $('#portada');
  const marcar = () => { try { localStorage.setItem(CONFIG.clavePortada, '1'); } catch(e) {} };
  $('#linea').textContent = CONFIG.linea;
  const wrap = $('#menuWrap');
  if (DE_VUELTA) {
    portada.hidden = true;
    document.body.classList.add('de-vuelta');
    wrap.classList.add('bajo');
    const aviso = $('#avisoEjemplo');
    if (aviso && aviso.innerHTML) $('#bandaZona').insertAdjacentElement('afterend', aviso);
    return;
  }
  $('#btnPortada').addEventListener('click', e => { e.preventDefault(); marcar(); irA('#bandaZona'); });

  /* Al salir de la portada, el menú muestra el logo y el avance, y la portada queda marcada como vista. */
  let entro = false;
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(es => es.forEach(e => {
      wrap.classList.toggle('bajo', !e.isIntersecting);
      if (e.isIntersecting) entro = true; else if (entro) marcar();
    }), { threshold: 0, rootMargin: '-80px 0px 0px 0px' }).observe(portada);
  } else {
    wrap.classList.add('bajo');
  }
}

function pintarQueEs(){
  $('#queEsTit').textContent = 'Qué es ' + CONFIG.sistema;
  $('#queEsTxt').textContent = CONFIG.descripcion;
}

function pintarPie(){
  $('#pie').innerHTML = `
    <div class="pie-iso" role="img" aria-label="${esc(CONFIG.institucion)}"></div>
    <div class="pie-der">
      <div class="pie-cred">
        <span class="wm" data-wm></span>
        <span class="pie-sep" aria-hidden="true"></span>
        <span>Creado por ${esc(CONFIG.autoria)}</span>
      </div>
      <a class="pie-cc" rel="license noopener" target="_blank" href="${esc(CONFIG.licenciaUrl)}" title="${esc(CONFIG.licenciaNombre)}">${esc(CONFIG.licenciaCorta)}</a>
    </div>`;
}

/* Ilustración animada: se reproduce sola salvo que el sistema pida reducir el movimiento.
   Siempre hay un botón para pausarla o reanudarla, y se detiene cuando sale de la pantalla. */
function animarIlustracion(){
  const caja = $('.ilus-caja'), v = caja && caja.querySelector('video'), b = caja && caja.querySelector('.ilus-pausa');
  if (!v || !b || typeof v.play !== 'function') return;
  const ICO_PAUSA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const ICO_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
  let quiere = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let visible = true;
  function boton(){
    b.innerHTML = quiere ? ICO_PAUSA : ICO_PLAY;
    b.setAttribute('aria-label', quiere ? 'Pausar la animación de la ilustración' : 'Reproducir la animación de la ilustración');
    b.title = quiere ? 'Pausar animación' : 'Reproducir animación';
  }
  function aplicar(){
    if (quiere && visible){
      if (v.preload === 'none') v.preload = 'auto';
      const p = v.play(); if (p && p.catch) p.catch(() => { quiere = false; boton(); });
    } else if (!v.paused) v.pause();
    boton();
  }
  v.addEventListener('playing', () => caja.classList.add('anima'));
  const fallo = () => { caja.classList.remove('anima'); b.hidden = true; };
  v.addEventListener('error', fallo);
  const ultima = v.querySelector('source:last-of-type'); if (ultima) ultima.addEventListener('error', fallo);
  b.addEventListener('click', () => { quiere = !quiere; aplicar(); });
  if ('IntersectionObserver' in window){
    new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; aplicar(); })).observe(caja);
  }
  b.hidden = false;
  aplicar();
}

/* ===================== ARRANQUE ===================== */
if (EJEMPLO) {
  $('#avisoEjemplo').className = 'ejemplo-aviso';
  $('#avisoEjemplo').innerHTML = `<div class="wrap"><p><strong>Vista de ejemplo.</strong> El avance que se muestra es inventado, para ver cómo se ve la portada con trabajo hecho. No toca lo que tengas guardado. Quita <code>?ejemplo</code> de la dirección para ver tu avance real.</p></div>`;
}
pintarPie();
pintarLogotipos();
pintarBanda();
pintarMomentos();
pintarHerramientas();
pintarQueEs();
pintarMenu();
pintarPortada();
animarIlustracion();
</script>
